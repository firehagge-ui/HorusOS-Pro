# ─────────────────────────────────────────────────────────────────────────────
# Hórus Agência — deploy do site institucional (horusagencia.com.br)
# Escrito em 01/09/2026.
#
# ⚠️ POR QUE EXISTE UM PASSO DE BUILD NUM SITE DE HTML PURO
#
# Este repositório é a operação inteira da agência: sete clientes com briefing,
# compliance e entregas, a memória do negócio e os logs do Conselho. A pasta
# `site/` também guarda documentação interna (CLAUDE.md com 62 KB de decisões e
# pendências, PLANO.md) e 34 MB de arte-fonte em `site-fontes/`.
#
# Apontar `publish` direto para `site/` colocaria tudo isso no ar em endereço
# público e adivinhável: horusagencia.com.br/CLAUDE.md serviria o arquivo
# com as travas de publicação, os nomes dos clientes e o histórico de decisão.
# Por isso o publish é uma pasta GERADA, montada por uma lista explícita do que
# pode ir (`site/build-deploy.mjs`). O padrão é negar: arquivo novo em `site/`
# não vai ao ar até alguém escrevê-lo naquela lista.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "node site/build-deploy.mjs"
  publish = "site/_publish"

[build.environment]
  NODE_VERSION = "20"


# ── Cabeçalhos e redirecionamentos ───────────────────────────────────────────
# Moraram aqui até 25/09/2026. Foram para site/_headers e site/_redirects, que o
# build copia para dentro de site/_publish: o site sobe ARRASTANDO a pasta no
# painel, e nesse caminho a Netlify ignora este arquivo (os cabeçalhos não
# estavam valendo no ar). Dentro da pasta, valem por arrasto e por GitHub.
