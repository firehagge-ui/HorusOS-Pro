<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0A0B0F;font-family:'DM Sans',system-ui,sans-serif;position:relative}
  /* O mesmo tratamento do hero do site: o vídeo em cinza, repintado por blend. */
  .bg{position:absolute;inset:0;background:url(hero-poster.jpg) center/cover;
      filter:grayscale(.94) contrast(.98) brightness(.8) blur(1.4px);transform:scaleX(-1)}
  .tint{position:absolute;inset:0;mix-blend-mode:color;
        background:linear-gradient(100deg,#2563EB 0%,#123a7a 30%,#4a4420 62%,#6a5417 82%,#7a5f12 100%)}
  .veu{position:absolute;inset:0;
       background:radial-gradient(120% 90% at 12% 45%, rgba(10,11,15,.86) 0%, rgba(10,11,15,.55) 45%, rgba(10,11,15,.15) 100%)}
  .caixa{position:absolute;inset:0;padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between}
  .marca{display:flex;align-items:center;gap:16px}
  .marca img{width:52px;height:auto;display:block}
  .nome{font-size:34px;font-weight:500;letter-spacing:.14em;color:#fff}
  h1{font-size:74px;font-weight:700;letter-spacing:-.03em;line-height:1.02;color:#fff;max-width:15ch}
  .am{color:#F4C430}
  .pe{display:flex;align-items:center;gap:18px;font-family:'JetBrains Mono',monospace;
      font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62)}
  .pe i{width:6px;height:6px;border-radius:50%;background:#2563EB;display:block}
</style></head><body>
<div class="bg"></div><div class="tint"></div><div class="veu"></div>
<div class="caixa">
  <div class="marca"><img src="simbolo-grande.png" alt=""><span class="nome">HÓRUS</span></div>
  <h1>Presença digital para negócios <span class="am">ambiciosos.</span></h1>
  <div class="pe"><span>Sites</span><i></i><span>Sistemas</span><i></i><span>Automação com IA</span><i></i><span>Marketing</span></div>
</div></body></html>
